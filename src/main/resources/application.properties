quarkus.application.name=painel-investimentos
quarkus.application.version=1.0.0
quarkus.banner.enabled=false

# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-request-id
quarkus.http.cors.exposed-headers=x-request-id

# --- Banco PostgreSQL ---
# Em dev/test o Quarkus Dev Services sobe um container PostgreSQL automaticamente.
# Em producao (jar/container), informe QUARKUS_DATASOURCE_JDBC_URL/USERNAME/PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=investimentos
quarkus.datasource.password=investimentos
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=10S
quarkus.datasource.devservices.image-name=postgres:17-alpine

# --- JWT RS256 ---
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=painel-investimentos
mp.jwt.verify.algorithm=RS256
smallrye.jwt.sign.key.location=jwt/privateKey.pem
app.jwt.issuer=painel-investimentos
app.jwt.ttl-seconds=3600

# --- JSON ---
quarkus.jackson.write-dates-as-timestamps=false

# --- Documentacao ---
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=BearerAuth
quarkus.smallrye-openapi.security-scheme-description=JWT obtido em POST /auth/token (informe apenas o token)
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# --- Logs ---
quarkus.log.level=INFO
quarkus.log.category."br.com.investimentos".level=INFO

# --- Perfil de testes: banco recriado a cada execucao (Dev Services) ---
%test.quarkus.http.test-port=0
%test.app.db.recreate=true
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.log.level=WARN
%test.quarkus.log.category."br.com.investimentos".level=INFO

