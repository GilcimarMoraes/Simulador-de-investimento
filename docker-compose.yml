services:
  postgres:
    image: postgres:17-alpine
    container_name: painel-investimentos-db
    environment:
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
      POSTGRES_PASSWORD: investimentos
    ports:
      - "15433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investimentos -d investimentos"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: painel-investimentos:1.0.0
    container_name: painel-investimentos-api
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/investimentos"
      QUARKUS_DATASOURCE_USERNAME: "investimentos"
      QUARKUS_DATASOURCE_PASSWORD: "investimentos"
      APP_JWT_ISSUER: "painel-investimentos"
      APP_JWT_TTL_SECONDS: "3600"
      QUARKUS_LOG_LEVEL: "INFO"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/q/health/ready || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  dados-postgres:
    name: painel-investimentos-postgres
